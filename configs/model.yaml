# LLM configuration (OpenAI-compatible). Secrets via environment only.
provider: openai_compatible
# Default provider (analyze / chain / map)
base_url: ${LLM_BASE_URL:-https://api.deepseek.com}
api_key_env: LLM_API_KEY
model: ${LLM_MODEL:-deepseek-chat}
temperature: 0.1
max_tokens: 8192
timeout_sec: 180

chunking:
  max_chars_per_chunk: 1800
  overlap_chars: 150
  max_chunks_per_writeup: 60
  max_steps_per_chunk: 6

# Direct LLM mapping: full retained catalog, single model, no vector / A/B/C.
# Catalog is partitioned into batches so every technique is checked.
direct_llm:
  enabled: true
  prompt_version: direct_llm_v1
  batch_size: 40

prompt_versions:
  path_extract: v2
  technique_direct_llm: direct_llm_v1
  chain_extract: v1
  chain_recover: v1
